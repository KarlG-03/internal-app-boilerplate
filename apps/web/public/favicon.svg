<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <rect width="32" height="32" rx="6" fill="url(#g)"/>
  
  <!-- Compass circle -->
  <circle cx="16" cy="16" r="10" stroke="white" stroke-width="2" fill="none"/>
  
  <!-- Compass needle (pointing NE) -->
  <path d="M16 16L20 10" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 16L12 22" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2" fill="white"/>
  
  <!-- Small bar chart at bottom right -->
  <rect x="19" y="18" width="2" height="4" rx="0.5" fill="white" opacity="0.8"/>
  <rect x="23" y="15" width="2" height="7" rx="0.5" fill="white" opacity="0.6"/>
</svg>
