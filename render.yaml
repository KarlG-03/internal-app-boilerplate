# Render Blueprint: Postgres + Nest API + Vite static sites (web + admin).
#
# After apply, set in Render dashboard:
# - VITE_API_URL on each static site = full API URL (e.g. https://api.example.com)
# - CORS_ORIGIN on API = comma-separated web + admin origins
# - RESEND_*, WEB_APP_URL, APP_NAME as needed

databases:
  - name: app-db
    plan: free
    region: singapore
    databaseName: app_boilerplate

services:
  - type: web
    name: app-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm --filter api exec prisma migrate deploy && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: API_KEY
        generateValue: true
      - key: APP_NAME
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true

  - type: web
    name: app-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_NAME
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: app-admin
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm --filter admin build
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
